<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nostr Translate Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0f;
      color: #c8d4e8;
      min-height: 100vh;
    }
    #app { max-width: 800px; margin: 0 auto; padding: 20px; }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(30, 45, 74, 0.3);
      border-radius: 10px;
    }
    header h1 { font-size: 2em; color: #f0f4ff; margin-bottom: 10px; }
    .subtitle { color: #7a8ba8; }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding: 15px;
      background: #1e2d4a;
      border-radius: 10px;
    }
    .controls label { font-weight: 600; }
    .controls select {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #0a0a0f;
      color: #c8d4e8;
      font-size: 14px;
      cursor: pointer;
    }
    .events-list { display: flex; flex-direction: column; gap: 20px; }
    .event-card {
      background: #0d101a;
      border: 1px solid #1e2d4a;
      border-radius: 10px;
      padding: 20px;
    }
    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 12px;
      color: #3a5070;
    }
    .event-id { font-family: monospace; color: #7a8ba8; }
    .event-time { color: #f0a500; }
    .event-content {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .nostr-translate-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25em;
      padding: 0.15em 0.4em;
      border-radius: 0.2em;
      background: rgba(0, 122, 255, 0.1);
      color: #007AFF;
      font-size: 0.75em;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .nostr-translate-badge:hover { background: rgba(0, 122, 255, 0.2); }
    .nostr-translate-badge:active { background: rgba(0, 122, 255, 0.3); }
    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #1e2d4a;
      color: #7a8ba8;
      font-size: 14px;
    }
    footer a { color: #f0a500; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1> nostr Translate Demo </h1>
      <p class="subtitle">Auto-translation service for Nostr events</p>
    </header>

    <div class="controls">
      <label for="user-lang">Your language:</label>
      <select id="user-lang">
        <option value="en" selected>English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ar">العربية</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>

    <main class="events-list"></main>

    <footer>
      <p>Powered by <a href="https://github.com/nostr-oracle" target="_blank">Nostr Oracle</a></p>
    </footer>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────────
    // Translation Module (inline for simplicity)
    // ─────────────────────────────────────────────────────────────────────────────

    const CONFIG = {
      CACHE_TTL: 24 * 60 * 60 * 1000,
      MAX_CHARS: 500,
      FLAG_EMOJI: {
        en: '🇬🇧', es: '🇪🇸', fr: '🇫🇷', de: '🇩🇪', it: '🇮🇹',
        pt: '🇵🇹', ru: '🇷🇺', zh: '🇨🇳', ja: '🇯🇵', ko: '🇰🇷',
        ar: '🇸🇦', hi: '🇮🇳',
      },
    };

    let userLang = localStorage.getItem('nostr_translate_userLang') || 'en';
    let cached = JSON.parse(localStorage.getItem('nostr_translate_cache') || '{}');
    let uiState = JSON.parse(localStorage.getItem('nostr_translate_uiState') || '{}');

    function detectLanguage(text) {
      if (/[áéíóúüñ¡¿]/.test(text)) return 'es';
      if (/[çéèêëàâäôöùûüîï]/.test(text)) return 'fr';
      if (/[äöüß]/.test(text)) return 'de';
      if (/[àèéìíòóùú]/.test(text)) return 'it';
      if (/[áéíóúâêôãõç]/.test(text)) return 'pt';
      if (/[一-龯]/.test(text)) return 'zh';
      if (/[あ-んア-ン一-龯]/.test(text)) return 'ja';
      if (/[가-힣]/.test(text)) return 'ko';
      if (/[أ-ي]/.test(text)) return 'ar';
      if (/[ँ-ह]/.test(text)) return 'hi';
      return 'en';
    }

    function getCacheKey(eventId, lang) {
      return `${eventId}:${lang}`;
    }

    function translateText(text, targetLang, sourceLang) {
      const mock = {
        'es': { 'La reunión es': 'The meeting is', '¿Vas a ir?': 'Are you going?', 'centro de la ciudad': 'city center' },
        'it': { 'Ciao a tutti': 'Hello everyone', 'demo di traduzione': 'translation demo' },
        'fr': { 'Bonjour tout le monde': 'Hello everyone', 'démo de traduction': 'translation demo' },
        'de': { 'Guten Tag': 'Good day', 'Demo für automatische': 'demo for automatic' },
      };

      const src = sourceLang || detectLanguage(text);
      const translations = mock[src] || {};

      let result = text;
      for (const [k, v] of Object.entries(translations)) {
        result = result.replace(new RegExp(k, 'gi'), v);
      }

      if (result === text) {
        if (src !== targetLang) {
          return `(${src.toUpperCase()} → ${targetLang.toUpperCase()}) ${text.substring(0, 30)}...`;
        }
        return text;
      }

      return result;
    }

    function getTranslation(eventId, text, targetLang, sourceLang) {
      const cacheKey = getCacheKey(eventId, targetLang);
      const cachedItem = cached[cacheKey];

      if (cachedItem && Date.now() - cachedItem.timestamp < CONFIG.CACHE_TTL) {
        return cachedItem.text;
      }

      const translated = translateText(text, targetLang, sourceLang);
      cached[cacheKey] = { text: translated, timestamp: Date.now() };
      localStorage.setItem('nostr_translate_cache', JSON.stringify(cached));
      return translated;
    }

    function setUserLanguage(lang) {
      userLang = lang;
      localStorage.setItem('nostr_translate_userLang', lang);
    }

    function toggleTranslation(eventId) {
      uiState[eventId] = uiState[eventId] === 'original' ? 'translated' : 'original';
      localStorage.setItem('nostr_translate_uiState', JSON.stringify(uiState));
    }

    function getDisplayContent(eventId, text, targetLang, sourceLang) {
      const cacheKey = getCacheKey(eventId, targetLang);
      const cachedItem = cached[cacheKey];

      if (cachedItem && uiState[eventId] === 'translated') {
        console.log(`[Cache] Hit for ${eventId}, returning translated`);
        return cachedItem.text;
      }

      // If no cached translation but state says translated, translate now
      if (uiState[eventId] === 'translated') {
        console.log(`[Translate] No cache, translating now for ${eventId}`);
        const translated = translateText(text, targetLang, sourceLang);
        console.log(`[Translate] Got result: ${translated.substring(0, 50)}...`);

        // Store in cache
        cached[cacheKey] = { text: translated, timestamp: Date.now() };
        localStorage.setItem('nostr_translate_cache', JSON.stringify(cached));

        return translated;
      }

      console.log(`[Cache] Miss for ${eventId}, returning original`);
      return text;
    }

    function getFlag(lang) {
      return CONFIG.FLAG_EMOJI[lang] || '🏳️';
    }

    function capitalize(str) {
      const names = {
        'en': 'English', 'es': 'Spanish', 'fr': 'French', 'de': 'German',
        'it': 'Italian', 'pt': 'Portuguese', 'ru': 'Russian', 'zh': 'Chinese',
        'ja': 'Japanese', 'ko': 'Korean', 'ar': 'Arabic', 'hi': 'Hindi',
      };
      return names[str] || str.toUpperCase();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // Demo Events & Render
    // ─────────────────────────────────────────────────────────────────────────────

    const demoEvents = [
      {
        id: "demo-es-001",
        content: "La reunión es a las 3pm mañana en el centro de la ciudad. ¿Vas a ir?",
        tags: [["language", "es"]],
        pubkey: "demo-user-1",
        created_at: Math.floor(Date.now() / 1000)
      },
      {
        id: "demo-it-001",
        content: "Ciao a tutti! Questa è una demo di traduzione automatica su Nostr.",
        tags: [["language", "it"]],
        pubkey: "demo-user-2",
        created_at: Math.floor(Date.now() / 1000)
      },
      {
        id: "demo-en-001",
        content: "Hello everyone! This is an English event that won't be translated.",
        tags: [["language", "en"]],
        pubkey: "demo-user-3",
        created_at: Math.floor(Date.now() / 1000)
      },
      {
        id: "demo-fr-001",
        content: "Bonjour tout le monde! Voici une démo de traduction automatique sur Nostr.",
        tags: [["language", "fr"]],
        pubkey: "demo-user-4",
        created_at: Math.floor(Date.now() / 1000)
      },
      {
        id: "demo-de-001",
        content: "Guten Tag! Dies ist eine Demo für automatische Übersetzung auf Nostr.",
        tags: [["language", "de"]],
        pubkey: "demo-user-5",
        created_at: Math.floor(Date.now() / 1000)
      }
    ];

    function render() {
      console.log('[Render] Starting...');
      console.log('[Render] userLang:', userLang);
      console.log('[Render] demoEvents:', demoEvents.length);
      console.log('[Render] uiState:', uiState);

      const container = document.querySelector('.events-list');
      if (!container) {
        console.error('[Render] Container not found');
        return;
      }

      container.innerHTML = '';

      demoEvents.forEach(event => {
        const eventEl = document.createElement('div');
        eventEl.className = 'event-card';
        eventEl.dataset.eventId = event.id;

        const sourceLang = event.tags?.find(t => t[0] === 'language')?.[1] || 'en';
        const displayContent = getDisplayContent(event.id, event.content, userLang, sourceLang);
        console.log(`[Render] Event ${event.id}: source=${sourceLang}, userLang=${userLang}`);
        console.log(`[Render] Cache key: ${getCacheKey(event.id, userLang)}`);
        console.log(`[Render] displayContent: ${displayContent.substring(0, 50)}...`);
        console.log(`[Render] uiState[${event.id}]: ${uiState[event.id]}`);
        console.log(`[Render] Content length: ${displayContent.length}`);

        eventEl.innerHTML = `
          <div class="event-header">
            <span class="event-id">${event.id.slice(0, 16)}...</span>
            <span class="event-time">${new Date(event.created_at * 1000).toLocaleTimeString()}</span>
          </div>
          <div class="event-content" data-original="${event.content}">${displayContent}</div>
        `;

        console.log(`[Render] Event HTML set`);

        if (sourceLang !== userLang) {
          console.log(`[Render] Adding badge for ${event.id}: source=${sourceLang} user=${userLang}`);
          const badge = document.createElement('span');
          badge.className = 'nostr-translate-badge';
          badge.dataset.eventId = event.id;
          badge.innerHTML = `${getFlag(sourceLang)} ${capitalize(sourceLang)}`;
          badge.title = `Tap to toggle translation between ${capitalize(sourceLang)} and ${capitalize(userLang)}`;
          badge.style.display = 'inline-flex';
          badge.style.alignItems = 'center';
          badge.style.gap = '0.25em';
          badge.style.padding = '0.15em 0.4em';
          badge.style.borderRadius = '0.2em';
          badge.style.backgroundColor = 'rgba(0, 122, 255, 0.1)';
          badge.style.color = '#007AFF';
          badge.style.fontSize = '0.75em';
          badge.style.cursor = 'pointer';
          badge.style.userSelect = 'none';
          console.log(`[Render] Badge innerHTML: ${badge.innerHTML}`);
          console.log(`[Render] Badge class: ${badge.className}`);
          console.log(`[Render] Badge styles applied`);

          badge.addEventListener('click', () => {
            console.log(`[Click] Badge clicked for ${event.id}`);
            console.log(`[Click] Current uiState[${event.id}]: ${uiState[event.id]}`);
            console.log(`[Click] toggleTranslation exists: ${typeof toggleTranslation}`);
            console.log(`[Click] render exists: ${typeof render}`);
            
            toggleTranslation(event.id);
            console.log(`[Click] After toggleTranslation, uiState[${event.id}]: ${uiState[event.id]}`);
            render();
            console.log(`[Click] Render completed`);
          });

          eventEl.appendChild(badge);
          console.log(`[Render] Badge appended to ${event.id}`);
        } else {
          console.log(`[Render] NO badge for ${event.id}: source=${sourceLang} user=${userLang} (same language)`);
        }

        container.appendChild(eventEl);
        console.log(`[Render] Added event: ${event.id}`);
      });

      console.log('[Render] Complete');
    }

    // Initialize
    console.log('[Init] userLang from localStorage:', userLang);
    setUserLanguage(userLang);

    // Event listeners - debug version
    const langSelect = document.getElementById('user-lang');
    if (langSelect) {
      console.log('[Init] Found language select element');
      langSelect.addEventListener('change', (e) => {
        console.log('[Change] Event fired! Value:', e.target.value);
        console.log('[Change] setUserLanguage function exists:', typeof setUserLanguage);
        console.log('[Change] render function exists:', typeof render);

        setUserLanguage(e.target.value);
        console.log('[Change] After setUserLanguage, userLang:', userLang);
        render();
        console.log('[Change] Render completed');
      });
    } else {
      console.error('[Init] Language select element NOT FOUND');
    }

    // Initial render
    console.log('[Init] Calling render()...');
    render();
  </script>
</body>
</html>
